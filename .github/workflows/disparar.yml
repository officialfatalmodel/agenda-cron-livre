name: Agenda

# Este repositorio e PUBLICO de proposito: o agendador (schedule) do GitHub
# so e confiavel em repositorio publico.
# Aqui NAO tem video nem dado nenhum - este job apenas DA A ORDEM para o
# repositorio privado postar, e so da a ordem se ainda faltar postar.
on:
  schedule:
    - cron: '*/5 * * * *'
    - cron: '0 7 * * *'
    - cron: '30 7 * * *'
    - cron: '0 8 * * *'
    - cron: '0 15 * * *'
    - cron: '30 15 * * *'
    - cron: '0 16 * * *'
    - cron: '0 21 * * *'
    - cron: '30 21 * * *'
    - cron: '0 22 * * *'
    - cron: '0 1 * * *'
    - cron: '30 1 * * *'
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  agenda:
    runs-on: ubuntu-latest
    steps:
      - name: Verificar e dar a ordem
        env:
          TOKEN: ${{ secrets.ALVO_TOKEN }}
          ALVO: ${{ secrets.ALVO_REPO }}
        shell: bash
        run: |
          set -u
          API="https://api.github.com/repos/${ALVO}"
          pegar() {
            curl -sf --max-time 20 \
              -H "Authorization: Bearer ${TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "${API}/contents/$1" | jq -r '.content' | base64 -d 2>/dev/null
          }

          hoje=$(TZ='Etc/GMT+3' date +%F)
          agora=$(TZ='Etc/GMT+3' date +%H:%M)
          ah=${agora%%:*}; am=${agora##*:}
          agora_m=$(( 10#${ah} * 60 + 10#${am} ))
          echo "agora ${agora} (Horario de Recife)"

          cfg=$(pegar config-base.json)
          sl=$(pegar slots.json)
          if [ -z "${cfg}" ]; then
            echo "nao consegui ler os horarios - mando a ordem mesmo assim"
            cfg='{"horarios":[]}'
          fi
          if [ -z "${sl}" ]; then sl='{"dia":"","slots":[]}'; fi

          dia=$(echo "${sl}" | jq -r '.dia // ""')
          postados=$(echo "${sl}" | jq -r '(.slots // []) | join(",")')
          horarios=$(echo "${cfg}" | jq -r '.horarios[]?')

          deve=0
          if [ -z "${horarios}" ]; then
            deve=1
          else
            for h in ${horarios}; do
              hh=${h%%:*}; mm=${h##*:}
              hm=$(( 10#${hh} * 60 + 10#${mm} ))
              if [ "${agora_m}" -ge "${hm}" ] && [ "${agora_m}" -le $((hm + 90)) ]; then
                if [ "${dia}" != "${hoje}" ] || ! printf ',%s,' "${postados}" | grep -qF ",${h},"; then
                  echo "horario ${h} esta na janela e ainda nao publicou"
                  deve=1
                  break
                fi
                echo "horario ${h} ja foi publicado hoje"
              fi
            done
          fi

          if [ "${deve}" -ne 1 ]; then
            echo "nada a publicar agora"
            exit 0
          fi

          code=$(curl -s -o resp.txt -w '%{http_code}' -X POST \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${API}/actions/workflows/postar.yml/dispatches" \
            -d '{"ref":"master"}')
          echo "ordem enviada: HTTP ${code}"
          if [ "${code}" != "204" ]; then
            echo "FALHA ao dar a ordem"
            cat resp.txt
            exit 1
          fi
